[package]
name = "skillweaver"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
zip = "4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
